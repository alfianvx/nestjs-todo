services:
  postgres:
    image: postgres:16
    container_name: task_manager_postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_manager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d task_manager']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_manager_api
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
